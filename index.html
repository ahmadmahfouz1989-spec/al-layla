<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الليلة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { background: #02030a; }

    body {
      color: #fff;
      font-family: 'Tajawal', system-ui, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #sky { z-index: 0; }
    #fx  { z-index: 15; }

    /* ── Vignette / bloom overlays ─────────────────────────────────────── */
    #vignette {
      position: fixed; inset: -12%; pointer-events: none; z-index: 12;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,6,0.55) 80%, rgba(0,0,6,0.9) 100%);
      opacity: 0.7;
      transition: opacity 1.6s ease, transform 2.2s ease;
    }
    body.stall #vignette { opacity: 1; transform: scale(0.88); }
    body.climax #vignette { opacity: 0; transition: opacity 0.4s ease; }

    #bloom {
      position: fixed; inset: 0; pointer-events: none; z-index: 30; opacity: 0;
      background: radial-gradient(circle at 50% 50%, #ffffff 0%, #fff6e4 35%, #ffe6bd 70%, #f7d29a 100%);
    }

    /* ── Stage: title + ring counter ───────────────────────────────────── */
    .stage {
      position: fixed; inset: 0; z-index: 20;
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
      transition: transform 1.25s cubic-bezier(.55,0,.85,.35), opacity 1s ease 0.2s, filter 1.1s ease;
    }
    .stage.launch { transform: scale(2.4); opacity: 0; filter: blur(6px); }

    .tilt {
      display: flex; flex-direction: column; align-items: center;
      gap: clamp(1rem, 4vh, 2.4rem);
      transform-style: preserve-3d;
      will-change: transform;
    }

    .title {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.18em;
      font-size: clamp(2.6rem, 9vw, 5.2rem);
      font-weight: 800;
      line-height: 1.1;
    }
    .title-text {
      background: linear-gradient(180deg, #ffffff 30%, #c9d6ff 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 18px rgba(170,195,255,0.35));
      -webkit-mask-image: linear-gradient(to left, #000 45%, transparent 55%);
              mask-image: linear-gradient(to left, #000 45%, transparent 55%);
      -webkit-mask-size: 260% 100%; mask-size: 260% 100%;
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
      -webkit-mask-position: 0% 0; mask-position: 0% 0;
      animation: sweep-in 1.8s cubic-bezier(.22,1,.36,1) 0.15s forwards;
      padding: 0 0.05em;
    }

    @keyframes sweep-in {
      from { -webkit-mask-position: 0% 0; mask-position: 0% 0; opacity: 0.2; transform: translateY(10px); }
      to   { -webkit-mask-position: 100% 0; mask-position: 100% 0; opacity: 1; transform: translateY(0); }
    }

    /* ── Sand timer, sitting at the end of the title ─────────────────────── */
    .hourglass-icon {
      width: 0.48em; height: 0.7em; flex-shrink: 0;
      filter: drop-shadow(0 0 10px rgba(245, 199, 107, 0.45));
      opacity: 0;
      animation: fade-in 1s ease 1.2s forwards;
    }
    .hourglass-sand-top, .hourglass-sand-bottom { transform-box: fill-box; }
    .hourglass-sand-top    { transform-origin: 50% 100%; animation: sand-top-drain 3.2s ease-in-out infinite; }
    .hourglass-sand-bottom { transform-origin: 50% 0%;   animation: sand-bottom-fill 3.2s ease-in-out infinite; }
    .hourglass-stream { animation: sand-stream-fade 3.2s linear infinite; }
    .hourglass-grain  { animation: sand-grain-fall 0.55s linear infinite; }

    @keyframes sand-top-drain   { 0% { transform: scale(1); }    82%, 100% { transform: scale(0.05); } }
    @keyframes sand-bottom-fill { 0% { transform: scale(0.05); } 82%, 100% { transform: scale(1); } }
    @keyframes sand-stream-fade { 0%, 78% { opacity: 1; } 84%, 100% { opacity: 0; } }
    @keyframes sand-grain-fall {
      0%   { transform: translateY(-4px); opacity: 0; }
      15%, 85% { opacity: 1; }
      100% { transform: translateY(4px); opacity: 0; }
    }

    .ring-wrap {
      position: relative;
      width: min(66vw, 300px, 44vh);
      aspect-ratio: 1 / 1;
      opacity: 0;
      animation: ring-in 1.4s cubic-bezier(.22,1,.36,1) 0.45s forwards;
    }
    .ring-wrap.beat { animation: beat 0.22s ease-out; opacity: 1; }
    body.stall .ring-wrap { animation: heartbeat 0.9s ease-in-out infinite; opacity: 1; }

    .ring-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    #arc { transition: stroke-dashoffset 0.05s linear; }

    .readout {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0.3em;
    }
    .num-row { direction: ltr; display: flex; align-items: flex-start; line-height: 1; }
    .num {
      font-size: min(19vw, 88px, 13vh);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      background-image: linear-gradient(180deg, #ffffff, #b9ccff);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }
    .num.num-bump { animation: num-bump 0.18s ease; }
    .pct {
      font-size: min(6vw, 26px, 4vh);
      font-weight: 700;
      color: rgba(255,255,255,0.55);
      margin-top: 0.35em;
      margin-left: 0.1em;
    }
    .label {
      font-size: clamp(0.85rem, 3.6vw, 1.05rem);
      font-weight: 500;
      color: rgba(220,228,255,0.6);
    }

    /* ── Reveal payoff ──────────────────────────────────────────────────── */
    .reveal {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1.4rem;
      padding: 16px;
      text-align: center;
      opacity: 0; pointer-events: none;
      z-index: 25;
    }
    .reveal.active { opacity: 1; pointer-events: auto; }

    .reveal-divider {
      width: 0; height: 1.5px;
      background: linear-gradient(90deg, transparent, #f5c76b, transparent);
      transition: width 1.6s cubic-bezier(.22,1,.36,1) 0.6s;
    }
    .reveal.active .reveal-divider { width: min(260px, 64vw); }

    .reveal-title {
      font-size: clamp(2.4rem, 10vw, 5.2rem);
      font-weight: 800;
      line-height: 1.25;
      padding: 0 0.1em;
      background: linear-gradient(110deg, #f0b860 0%, #fff3d6 18%, #ffd27a 36%, #ffffff 50%, #ffd27a 64%, #fff3d6 82%, #f0b860 100%);
      background-size: 220% 100%;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      -webkit-mask-image: linear-gradient(to left, #000 45%, transparent 55%);
              mask-image: linear-gradient(to left, #000 45%, transparent 55%);
      -webkit-mask-size: 260% 100%; mask-size: 260% 100%;
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
      -webkit-mask-position: 0% 0; mask-position: 0% 0;
    }
    .reveal.active .reveal-title {
      animation:
        sweep-in 2.2s cubic-bezier(.22,1,.36,1) 0.2s forwards,
        sheen 7s linear 2.4s infinite,
        title-glow 4s ease-in-out 2.4s infinite;
    }

    .reveal-subtitle {
      font-size: clamp(1.05rem, 4vw, 1.5rem);
      font-weight: 500;
      color: rgba(235,240,255,0.78);
      opacity: 0;
      transform: translateY(14px);
      filter: blur(6px);
      transition: opacity 1.4s ease 1.3s, transform 1.4s cubic-bezier(.22,1,.36,1) 1.3s, filter 1.4s ease 1.3s;
    }
    .reveal.active .reveal-subtitle { opacity: 1; transform: translateY(0); filter: blur(0); }

    @keyframes sheen { from { background-position: 0% 0; } to { background-position: -220% 0; } }
    @keyframes title-glow {
      0%, 100% { filter: drop-shadow(0 0 14px rgba(255,200,110,0.30)); }
      50%      { filter: drop-shadow(0 0 30px rgba(255,200,110,0.60)); }
    }
    @keyframes fade-in { to { opacity: 1; } }
    @keyframes ring-in {
      from { opacity: 0; transform: scale(0.82) rotate(-25deg); filter: blur(8px); }
      to   { opacity: 1; transform: scale(1) rotate(0deg); filter: blur(0); }
    }
    @keyframes beat { 0% { transform: scale(1); } 35% { transform: scale(1.025); } 100% { transform: scale(1); } }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      12% { transform: scale(1.045); }
      24% { transform: scale(1); }
      36% { transform: scale(1.03); }
      50% { transform: scale(1); }
    }
    @keyframes num-bump { 0% { transform: scale(1); } 30% { transform: scale(1.12); } 100% { transform: scale(1); } }

    @media (prefers-reduced-motion: reduce) {
      .title-text, .reveal.active .reveal-title { animation-duration: 0.6s; }
      body.stall .ring-wrap { animation: none; }
      .stage { transition-duration: 0.6s; }
    }
  </style>
</head>
<body>
  <canvas id="sky"></canvas>
  <div id="vignette"></div>

  <div class="stage" id="stage">
    <div class="tilt" id="tilt">
      <h1 class="title">
        <span class="title-text">الليلة</span>
        <span class="hourglass-icon" aria-hidden="true">
          <svg viewBox="0 0 44 64" width="100%" height="100%">
            <defs>
              <linearGradient id="sandGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ffe9b0"/>
                <stop offset="100%" stop-color="#f0a93a"/>
              </linearGradient>
            </defs>
            <rect x="3" y="1" width="38" height="5" rx="2.5" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2"/>
            <rect x="3" y="58" width="38" height="5" rx="2.5" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2"/>
            <path d="M6,6 L38,6 L22,32 L38,58 L6,58 L22,32 Z" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.6" stroke-linejoin="round"/>
            <polygon class="hourglass-sand-top" points="9,9 35,9 22,30" fill="url(#sandGrad)"/>
            <polygon class="hourglass-sand-bottom" points="22,34 35,55 9,55" fill="url(#sandGrad)"/>
            <rect class="hourglass-stream" x="21" y="29" width="2" height="6" fill="#f5c76b"/>
            <circle class="hourglass-grain" cx="22" cy="32" r="1.3" fill="#ffe9b0"/>
          </svg>
        </span>
      </h1>

      <div class="ring-wrap" id="ringWrap">
        <svg id="ring" viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <linearGradient id="arcGrad" gradientUnits="userSpaceOnUse" x1="200" y1="0" x2="0" y2="200">
              <stop id="g0" offset="0%" stop-color="#5d76c9"/>
              <stop id="g1" offset="100%" stop-color="#cfe0ff"/>
            </linearGradient>
          </defs>
          <!-- faint outer tick ring -->
          <circle cx="100" cy="100" r="97" fill="none" stroke="rgba(200,215,255,0.10)" stroke-width="0.6" stroke-dasharray="0.6 4.47"/>
          <!-- track -->
          <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(190,205,255,0.10)" stroke-width="3"/>
          <!-- inner hairline -->
          <circle cx="100" cy="100" r="80" fill="none" stroke="rgba(190,205,255,0.06)" stroke-width="0.6"/>
          <!-- progress arc, starts at 12 o'clock and runs clockwise -->
          <circle id="arc" cx="100" cy="100" r="88" fill="none" stroke="url(#arcGrad)" stroke-width="3.6"
                  stroke-linecap="round" transform="rotate(-90 100 100)"/>
        </svg>
        <div class="readout">
          <div class="num-row"><span class="num" id="num">0</span><span class="pct">%</span></div>
          <span class="label">مؤشر الليلة</span>
        </div>
      </div>
    </div>
  </div>

  <canvas id="fx"></canvas>

  <!-- Reveal payoff, shown once the climax settles. Edit REVEAL_TITLE / REVEAL_SUBTITLE below. -->
  <div class="reveal" id="reveal">
    <div class="reveal-divider"></div>
    <h2 class="reveal-title" id="revealTitle"></h2>
    <p class="reveal-subtitle" id="revealSubtitle"></p>
    <div class="reveal-divider"></div>
  </div>

  <div id="bloom"></div>

  <script>
    // ── Edit these for the actual reveal ────────────────────────────────────
    const REVEAL_TITLE    = 'الليلة موعدنا';
    const REVEAL_SUBTITLE = 'العين على مضيق هرمز';

    const $ = id => document.getElementById(id);
    $('revealTitle').textContent    = REVEAL_TITLE;
    $('revealSubtitle').textContent = REVEAL_SUBTITLE;

    const sky = $('sky'), sctx = sky.getContext('2d');
    const fx  = $('fx'),  fctx = fx.getContext('2d');
    const stage = $('stage'), tilt = $('tilt'), ringWrap = $('ringWrap'), ringSvg = $('ring');
    const arc = $('arc'), g0 = $('g0'), g1 = $('g1');
    const num = $('num'), bloom = $('bloom'), reveal = $('reveal');

    const isMobile     = window.innerWidth < 768;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const DPR          = Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2);

    const RING_R = 88;
    const CIRC   = 2 * Math.PI * RING_R;
    arc.style.strokeDasharray  = CIRC;
    arc.style.strokeDashoffset = CIRC;

    const lerp  = (a, b, t) => a + (b - a) * t;
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
    const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
    const rgb   = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
    const mix   = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];

    // Shared scene state — the progress phases only write here, the render loop reads it.
    const S = {
      value: 0, intensity: 0,
      stage: 'build',            // build | stall | warp | reveal
      warp: 0, warpTarget: 0, zoom: 0,
      skyWarm: 0,
      moonX: 0, moonY: 0, moonReady: false,
      emitting: false, ambient: false,
      px: 0, py: 0, tpx: 0, tpy: 0,
    };

    // Ring colour ramp: moonlit silver → gold → ember
    const C_SILVER = [170, 200, 255], C_GOLD = [255, 212, 125], C_EMBER = [255, 140, 60];
    function ringColor(i) {
      return i < 0.65 ? mix(C_SILVER, C_GOLD, i / 0.65) : mix(C_GOLD, C_EMBER, (i - 0.65) / 0.35);
    }

    // ── Sizing ──────────────────────────────────────────────────────────────
    let W = 0, H = 0;
    function resize() {
      W = window.innerWidth; H = window.innerHeight;
      for (const c of [sky, fx]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
      sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      fctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      buildStars();
      buildMilkyWay();
      buildMoon();
      S.moonReady = false;
    }
    window.addEventListener('resize', resize);

    // ── Pre-rendered sprites ────────────────────────────────────────────────
    function makeGlowSprite(size, stops) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const x = c.getContext('2d');
      const g = x.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      stops.forEach(([o, col]) => g.addColorStop(o, col));
      x.fillStyle = g; x.fillRect(0, 0, size, size);
      return c;
    }
    const starSprite = makeGlowSprite(32, [[0, 'rgba(255,255,255,1)'], [0.2, 'rgba(230,238,255,0.55)'], [1, 'rgba(200,215,255,0)']]);
    const goldSprite = makeGlowSprite(64, [[0, 'rgba(255,255,235,1)'], [0.3, 'rgba(255,214,130,0.85)'], [0.65, 'rgba(255,160,70,0.28)'], [1, 'rgba(255,120,40,0)']]);

    // ── Stars: three parallax depths ────────────────────────────────────────
    let stars = [];
    const STAR_TINTS = ['#ffffff', '#ffffff', '#ffffff', '#dbe6ff', '#ffe6c4'];
    function buildStars() {
      const n = isMobile ? 170 : 360;
      stars = Array.from({ length: n }, () => {
        const d = Math.random();
        const depth = d < 0.6 ? 0.25 : d < 0.9 ? 0.55 : 1;
        return {
          x: Math.random() * W, y: Math.random() * H * 0.92,
          r: (0.35 + Math.random() * 0.55) * (0.6 + depth),
          depth,
          ph: Math.random() * Math.PI * 2,
          sp: 0.4 + Math.random() * 1.3,
          tint: STAR_TINTS[(Math.random() * STAR_TINTS.length) | 0],
        };
      });
    }

    // ── Milky Way band, painted once to an offscreen canvas ─────────────────
    let milky = null;
    function buildMilkyWay() {
      milky = document.createElement('canvas');
      milky.width = W; milky.height = H;
      const m = milky.getContext('2d');
      m.translate(W * 0.5, H * 0.38);
      m.rotate(-0.42);
      const bandH = Math.max(H, W) * 0.16;
      m.filter = 'blur(28px)';
      const g = m.createLinearGradient(0, -bandH, 0, bandH);
      g.addColorStop(0, 'rgba(120,130,255,0)');
      g.addColorStop(0.5, 'rgba(150,160,255,0.10)');
      g.addColorStop(1, 'rgba(120,130,255,0)');
      m.fillStyle = g;
      m.fillRect(-W * 1.2, -bandH, W * 2.4, bandH * 2);
      m.filter = 'blur(14px)';
      for (let i = 0; i < 46; i++) {
        m.fillStyle = Math.random() < 0.5 ? 'rgba(200,180,255,0.05)' : 'rgba(255,215,195,0.04)';
        m.beginPath();
        m.ellipse((Math.random() - 0.5) * W * 2.2, gauss() * bandH * 0.45, 30 + Math.random() * 90, 14 + Math.random() * 40, 0, 0, Math.PI * 2);
        m.fill();
      }
      m.filter = 'none';
      const dots = isMobile ? 500 : 1200;
      for (let i = 0; i < dots; i++) {
        m.fillStyle = `rgba(235,240,255,${0.08 + Math.random() * 0.35})`;
        const s = Math.random() < 0.9 ? 0.7 : 1.2;
        m.fillRect((Math.random() - 0.5) * W * 2.2, gauss() * bandH * 0.55, s, s);
      }
    }

    // ── Crescent moon ───────────────────────────────────────────────────────
    let moonImg = null, moonR = 40;
    function buildMoon() {
      moonR = clamp(Math.min(W, H) * 0.06, 24, 62);
      const size = Math.ceil(moonR * 2 + 4);
      moonImg = document.createElement('canvas');
      moonImg.width = moonImg.height = size;
      const m = moonImg.getContext('2d');
      const c = size / 2;
      const g = m.createRadialGradient(c - moonR * 0.3, c - moonR * 0.3, 0, c, c, moonR);
      g.addColorStop(0, '#fffdf6');
      g.addColorStop(0.7, '#f3ecd8');
      g.addColorStop(1, '#d9d0b8');
      m.fillStyle = g;
      m.beginPath(); m.arc(c, c, moonR, 0, Math.PI * 2); m.fill();
      // soft maria
      m.fillStyle = 'rgba(170,160,140,0.18)';
      [[-0.35, 0.1, 0.22], [-0.1, 0.45, 0.16], [-0.5, -0.35, 0.12]].forEach(([dx, dy, r]) => {
        m.beginPath(); m.arc(c + dx * moonR, c + dy * moonR, r * moonR, 0, Math.PI * 2); m.fill();
      });
      // carve the crescent
      m.globalCompositeOperation = 'destination-out';
      m.filter = 'blur(1.5px)';
      m.beginPath(); m.arc(c + moonR * 0.52, c - moonR * 0.18, moonR * 0.92, 0, Math.PI * 2); m.fill();
      m.filter = 'none';
      m.globalCompositeOperation = 'source-over';
    }

    // ── Shooting stars ──────────────────────────────────────────────────────
    class ShootingStar {
      constructor() {
        this.x     = W * 0.1 + Math.random() * W * 0.7;
        this.y     = -20 + Math.random() * H * 0.15;
        this.len   = 90 + Math.random() * 90;
        this.speed = 9 + Math.random() * 5;
        this.angle = Math.PI / 3.4 + (Math.random() - 0.5) * 0.35;
        if (Math.random() < 0.5) { this.angle = Math.PI - this.angle; this.x = W - this.x; }
        this.life  = 1;
      }
      update() {
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;
        this.life -= 0.016;
      }
      draw() {
        const dx = Math.cos(this.angle) * this.len, dy = Math.sin(this.angle) * this.len;
        const grad = sctx.createLinearGradient(this.x, this.y, this.x - dx, this.y - dy);
        grad.addColorStop(0, `rgba(255,255,255,${Math.max(this.life, 0)})`);
        grad.addColorStop(1, 'rgba(200,215,255,0)');
        sctx.strokeStyle = grad;
        sctx.lineWidth = 1.6;
        sctx.beginPath(); sctx.moveTo(this.x, this.y); sctx.lineTo(this.x - dx, this.y - dy); sctx.stroke();
        sctx.globalAlpha = Math.max(this.life, 0);
        sctx.drawImage(starSprite, this.x - 6, this.y - 6, 12, 12);
        sctx.globalAlpha = 1;
      }
    }
    let shootingStars = [];
    let nextShootingStarAt = 1800 + Math.random() * 2500;

    // ── Ring geometry in screen space ───────────────────────────────────────
    function ringGeom() {
      const r = ringSvg.getBoundingClientRect();
      const half = r.width / 2;
      return { cx: r.left + half, cy: r.top + r.height / 2, rr: half * (RING_R / 100) };
    }
    let geom = { cx: 0, cy: 0, rr: 100 };

    // ── Sky render ──────────────────────────────────────────────────────────
    function drawDune(base, amp, freq, phase, par, fill, rimAlpha) {
      sctx.beginPath();
      sctx.moveTo(-30, H + 10);
      for (let x = -30; x <= W + 30; x += 18) {
        const xx = x + S.px * par;
        const y = base + Math.sin(xx * freq + phase) * amp + Math.sin(xx * freq * 2.3 + phase * 1.7) * amp * 0.38;
        sctx.lineTo(x, y);
      }
      sctx.lineTo(W + 30, H + 10);
      sctx.closePath();
      sctx.fillStyle = fill;
      sctx.fill();
      sctx.strokeStyle = `rgba(175,190,255,${rimAlpha})`;
      sctx.lineWidth = 1.2;
      sctx.stroke();
    }

    function drawSky(t, dt) {
      const I = S.skyWarm;

      // Background gradient: deep navy that warms toward the horizon as tension builds
      const g = sctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#02030a');
      g.addColorStop(0.5, rgb(mix([7, 9, 26], [16, 10, 30], I)));
      g.addColorStop(0.85, rgb(mix([22, 28, 70], [70, 34, 58], I)));
      g.addColorStop(1, rgb(mix([30, 36, 84], [110, 52, 48], I)));
      sctx.fillStyle = g;
      sctx.fillRect(0, 0, W, H);

      // Milky way
      sctx.globalAlpha = 0.85 * (1 - S.warp * 0.7);
      sctx.drawImage(milky, S.px * 6, S.py * 4, W, H);
      sctx.globalAlpha = 1;

      // Stars (and their hyperspace streaks)
      const cx = geom.cx || W / 2, cy = geom.cy || H / 2;
      const warping = S.warp > 0.01;
      sctx.globalCompositeOperation = 'lighter';
      for (const s of stars) {
        if (!reduceMotion) { s.x -= s.depth * 0.0045 * dt; if (s.x < -10) s.x += W + 20; }
        const x = s.x + S.px * 22 * s.depth;
        const y = s.y + S.py * 14 * s.depth;
        const tw = 0.3 + 0.7 * Math.abs(Math.sin(t * 0.0009 * s.sp + s.ph));
        let a = tw * (0.4 + 0.6 * s.depth);

        if (warping) {
          const dx = x - cx, dy = y - cy;
          const sc = 1 + S.zoom * (0.4 + s.depth);
          const L  = S.warp * (0.06 + 0.45 * s.depth) * (1 + S.zoom * 0.4);
          const hx = cx + dx * sc, hy = cy + dy * sc;
          const k  = sc * Math.max(0, 1 - L);
          sctx.strokeStyle = s.tint;
          sctx.globalAlpha = Math.min(1, a * (1 + S.warp * 1.5));
          sctx.lineWidth   = s.r * (1 + S.warp * 0.8);
          sctx.beginPath(); sctx.moveTo(cx + dx * k, cy + dy * k); sctx.lineTo(hx, hy); sctx.stroke();
        } else {
          sctx.globalAlpha = a;
          if (s.r > 0.9) {
            const d = s.r * 7;
            sctx.drawImage(starSprite, x - d / 2, y - d / 2, d, d);
          } else {
            sctx.fillStyle = s.tint;
            sctx.fillRect(x - s.r, y - s.r, s.r * 2, s.r * 2);
          }
        }
      }
      sctx.globalAlpha = 1;
      sctx.globalCompositeOperation = 'source-over';

      // Shooting stars — more frequent as the night heats up
      if (!warping && t > nextShootingStarAt && shootingStars.length < 2) {
        shootingStars.push(new ShootingStar());
        const busy = S.stage === 'stall' || S.stage === 'reveal' || S.intensity > 0.85;
        nextShootingStarAt = t + (busy ? 1400 : 4500) + Math.random() * (busy ? 2200 : 6000);
      }
      for (let i = shootingStars.length - 1; i >= 0; i--) {
        shootingStars[i].update(); shootingStars[i].draw();
        if (shootingStars[i].life <= 0 || shootingStars[i].y > H + 50) shootingStars.splice(i, 1);
      }

      // Moon rises with the counter; settles above the reveal text afterwards
      let tx, ty;
      if (S.stage === 'reveal') { tx = W / 2; ty = H * (isMobile ? 0.2 : 0.18); }
      else {
        const mt = easeOutCubic(S.value / 100);
        tx = W * (isMobile ? 0.2 : 0.22);
        ty = lerp(H * 0.95, H * (isMobile ? 0.14 : 0.2), mt);
      }
      if (!S.moonReady) { S.moonX = tx; S.moonY = ty; S.moonReady = true; }
      const k = Math.min(1, dt * 0.005);
      S.moonX += (tx - S.moonX) * k; S.moonY += (ty - S.moonY) * k;
      const mx = S.moonX + S.px * 10, my = S.moonY + S.py * 6;
      const glowI = S.stage === 'reveal' ? 0.8 : S.intensity;

      sctx.globalCompositeOperation = 'lighter';
      const haloR = moonR * (9 + glowI * 5);
      const hg = sctx.createRadialGradient(mx, my, moonR * 0.6, mx, my, haloR);
      hg.addColorStop(0, `rgba(200,212,255,${0.16 + glowI * 0.12})`);
      hg.addColorStop(0.25, `rgba(160,175,255,${0.05 + glowI * 0.05})`);
      hg.addColorStop(1, 'rgba(120,130,255,0)');
      sctx.fillStyle = hg;
      sctx.fillRect(mx - haloR, my - haloR, haloR * 2, haloR * 2);
      sctx.globalCompositeOperation = 'source-over';
      // dark side of the moon blocks the halo, leaving a faint earthshine
      sctx.fillStyle = 'rgba(14,16,34,0.88)';
      sctx.beginPath(); sctx.arc(mx, my, moonR - 0.5, 0, Math.PI * 2); sctx.fill();
      sctx.drawImage(moonImg, mx - moonImg.width / 2, my - moonImg.height / 2);

      // Dune horizon, lit along the rim by moonlight
      const rim = 0.1 + glowI * 0.18;
      drawDune(H * 0.86, H * 0.025, 0.004, 1.3, 8,  '#070915', rim * 0.6);
      drawDune(H * 0.93, H * 0.03,  0.0028, 4.1, 16, '#020309', rim);
    }

    // ── FX particles ────────────────────────────────────────────────────────
    const MAX_MOTES  = isMobile ? 120 : 280;
    const MAX_SPARKS = isMobile ? 24 : 60;
    const motes = [], sparks = [], waves = [], rockets = [], fwParticles = [];

    class Mote {
      constructor(x, y, vx, vy, size, decay, opts = {}) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.size = size; this.decay = decay; this.life = 1;
        this.drag = opts.drag ?? 0.97; this.grav = opts.grav ?? 0; this.shrink = opts.shrink ?? 0.985;
        this.flick = opts.flick ? Math.random() * 6.28 : null;
      }
      update() {
        this.vx *= this.drag; this.vy = this.vy * this.drag + this.grav;
        this.x += this.vx; this.y += this.vy;
        if (this.flick !== null) { this.flick += 0.12; this.x += Math.sin(this.flick) * 0.25; }
        this.life -= this.decay; this.size *= this.shrink;
      }
      draw() {
        const d = this.size * 2;
        const f = this.flick !== null ? 0.55 + 0.45 * Math.sin(this.flick * 2.3) : 1;
        fctx.globalAlpha = Math.max(0, this.life) * f;
        fctx.drawImage(goldSprite, this.x - d / 2, this.y - d / 2, d, d);
      }
    }

    class Spark {
      constructor(x, y, vx, vy) {
        this.x = x; this.y = y; this.px = x; this.py = y;
        this.vx = vx; this.vy = vy; this.life = 1;
        this.decay = 0.025 + Math.random() * 0.03;
      }
      update() {
        this.px = this.x; this.py = this.y;
        this.vy += 0.08; this.vx *= 0.985;
        this.x += this.vx; this.y += this.vy;
        this.life -= this.decay;
      }
      draw() {
        fctx.globalAlpha = Math.max(0, this.life);
        fctx.strokeStyle = 'rgb(255,226,160)';
        fctx.lineWidth = 1.3;
        fctx.beginPath(); fctx.moveTo(this.px, this.py); fctx.lineTo(this.x, this.y); fctx.stroke();
      }
    }

    class Shockwave {
      constructor(x, y, r0, delay, width) {
        this.x = x; this.y = y; this.r = r0; this.delay = delay; this.width = width;
        this.life = 1; this.v = 6;
      }
      update() {
        if (this.delay > 0) { this.delay--; return; }
        this.v *= 1.045; this.r += this.v; this.life -= 0.022;
      }
      draw() {
        if (this.delay > 0 || this.life <= 0) return;
        fctx.globalAlpha = this.life;
        fctx.strokeStyle = 'rgb(255,222,150)';
        fctx.lineWidth = this.width * this.life + 0.5;
        fctx.beginPath(); fctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); fctx.stroke();
      }
    }

    class Rocket {
      constructor(x, targetY) {
        this.x = x; this.y = H + 10; this.targetY = targetY;
        this.vx = (Math.random() - 0.5) * 0.6;
        this.vy = -(8 + Math.random() * 3);
        this.trail = []; this.done = false;
      }
      update() {
        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > 8) this.trail.shift();
        this.x += this.vx; this.y += this.vy; this.vy *= 0.993;
        if (this.y <= this.targetY) this.done = true;
      }
      draw() {
        fctx.globalAlpha = 0.9;
        fctx.strokeStyle = 'rgb(255,236,200)';
        fctx.lineWidth = 2;
        fctx.beginPath();
        if (this.trail.length) { fctx.moveTo(this.trail[0].x, this.trail[0].y); for (const p of this.trail) fctx.lineTo(p.x, p.y); }
        fctx.lineTo(this.x, this.y); fctx.stroke();
      }
    }

    class FireworkParticle {
      constructor(x, y, hue, ring) {
        this.x = x; this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = ring ? 4.2 + Math.random() * 0.6 : 1.2 + Math.random() * 4.8;
        this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
        this.life = 1; this.decay = Math.random() * 0.01 + 0.011;
        this.hue = hue; this.trail = [];
        this.twinkle = Math.random() < 0.3;
      }
      update() {
        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > 5) this.trail.shift();
        this.vy += 0.04; this.vx *= 0.982; this.vy *= 0.982;
        this.x += this.vx; this.y += this.vy;
        this.life -= this.decay;
      }
      draw() {
        if (this.life <= 0) return;
        let a = this.life;
        if (this.twinkle && this.life < 0.5) a *= Math.random() < 0.5 ? 0.2 : 1;
        fctx.globalAlpha = a;
        fctx.strokeStyle = `hsl(${this.hue}, 95%, ${this.hue === 0 ? 100 : 68}%)`;
        fctx.lineWidth = 1.8;
        fctx.beginPath();
        if (this.trail.length) { fctx.moveTo(this.trail[0].x, this.trail[0].y); for (const p of this.trail) fctx.lineTo(p.x, p.y); }
        fctx.lineTo(this.x, this.y); fctx.stroke();
      }
    }

    // gold, white, champagne, moon-blue, violet — hue 0 renders as white
    const FW_HUES = [42, 48, 0, 36, 215, 275];

    function launchFireworkShow() {
      const waves = isMobile ? 4 : 6;
      for (let i = 0; i < waves; i++) {
        setTimeout(() => {
          rockets.push(new Rocket(W * 0.12 + Math.random() * W * 0.76, H * 0.12 + Math.random() * H * 0.22));
        }, i * 380 + Math.random() * 220);
      }
      setTimeout(() => {
        for (let i = 0; i < Math.floor(waves * 0.7); i++) {
          setTimeout(() => rockets.push(new Rocket(W * 0.1 + Math.random() * W * 0.8, H * 0.1 + Math.random() * H * 0.25)), i * 300);
        }
      }, 2600);
    }

    function emitFromTip(tx, ty, I) {
      const ang = Math.atan2(ty - geom.cy, tx - geom.cx);
      const rx = Math.cos(ang), ry = Math.sin(ang);       // outward
      const tgx = -ry, tgy = rx;                           // clockwise tangent (direction of travel)
      const count = isMobile ? 1 + I * 2.5 : 2 + I * 6;
      for (let i = 0; i < count && motes.length < MAX_MOTES; i++) {
        const back = 0.3 + Math.random() * 0.9;
        const out  = (Math.random() - 0.3) * (0.5 + I * 1.6);
        motes.push(new Mote(
          tx + (Math.random() - 0.5) * 4, ty + (Math.random() - 0.5) * 4,
          -tgx * back + rx * out, -tgy * back + ry * out - 0.15,
          1.8 + Math.random() * (2.5 + I * 5), 0.018 + Math.random() * 0.02,
          { drag: 0.965 }
        ));
      }
      if (I > 0.45 && sparks.length < MAX_SPARKS && Math.random() < I * 0.55) {
        const sp = 3 + Math.random() * 5 * I;
        const jitter = (Math.random() - 0.5) * 0.9;
        sparks.push(new Spark(tx, ty, (rx + tgx * jitter) * sp, (ry + tgy * jitter) * sp - 1.5));
      }
    }

    function ringBurst() {
      const { cx, cy, rr } = geom;
      const n = isMobile ? 140 : 320;
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 2 + Math.random() * 9;
        motes.push(new Mote(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, Math.cos(a) * sp, Math.sin(a) * sp,
          2 + Math.random() * 6, 0.012 + Math.random() * 0.014, { drag: 0.955 }));
      }
      for (let i = 0; i < (isMobile ? 30 : 70); i++) {
        const a = Math.random() * Math.PI * 2, sp = 6 + Math.random() * 10;
        sparks.push(new Spark(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, Math.cos(a) * sp, Math.sin(a) * sp));
      }
      waves.push(new Shockwave(cx, cy, rr, 0, 7), new Shockwave(cx, cy, rr, 8, 3.5), new Shockwave(cx, cy, rr * 0.6, 16, 2));
    }

    function step(list) {
      for (let i = list.length - 1; i >= 0; i--) {
        const p = list[i];
        p.update(); p.draw();
        if (p.life <= 0 || (p.size !== undefined && p.size < 0.25)) list.splice(i, 1);
      }
    }

    function drawFx(t) {
      fctx.clearRect(0, 0, W, H);
      fctx.globalCompositeOperation = 'lighter';

      if (S.emitting && S.value > 0.3) {
        const I = S.intensity;
        const a = -Math.PI / 2 + (S.value / 100) * Math.PI * 2;
        let tx = geom.cx + Math.cos(a) * geom.rr, ty = geom.cy + Math.sin(a) * geom.rr;
        if (S.stage === 'stall') { tx += (Math.random() - 0.5) * 2.4; ty += (Math.random() - 0.5) * 2.4; }
        emitFromTip(tx, ty, I);
        // comet head
        const pulse = 1 + 0.12 * Math.sin(t * 0.012);
        const d = (26 + I * 34) * pulse;
        fctx.globalAlpha = 0.95;
        fctx.drawImage(goldSprite, tx - d / 2, ty - d / 2, d, d);
        fctx.drawImage(starSprite, tx - 6, ty - 6, 12, 12);
      }

      if (S.ambient && Math.random() < (isMobile ? 0.12 : 0.22) && motes.length < MAX_MOTES) {
        motes.push(new Mote(Math.random() * W, H + 10, (Math.random() - 0.5) * 0.3, -(0.35 + Math.random() * 0.6),
          1 + Math.random() * 2.2, 0.0025 + Math.random() * 0.003, { drag: 1, shrink: 0.999, flick: true }));
      }

      step(waves);
      step(motes);
      step(sparks);
      for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        r.update(); r.draw();
        if (r.done) {
          const hue = FW_HUES[(Math.random() * FW_HUES.length) | 0];
          const ring = Math.random() < 0.35;
          const n = isMobile ? 45 : 100;
          for (let k = 0; k < n; k++) fwParticles.push(new FireworkParticle(r.x, r.y, hue, ring));
          const d = 140;
          fctx.globalAlpha = 0.6;
          fctx.drawImage(goldSprite, r.x - d / 2, r.y - d / 2, d, d);
          rockets.splice(i, 1);
        }
      }
      step(fwParticles);

      fctx.globalAlpha = 1;
      fctx.globalCompositeOperation = 'source-over';
    }

    // ── Main loop ───────────────────────────────────────────────────────────
    let lastTs = 0;
    function frame(ts) {
      const dt = Math.min(50, lastTs ? ts - lastTs : 16);
      lastTs = ts;

      if (!reduceMotion) { S.px += (S.tpx - S.px) * 0.04; S.py += (S.tpy - S.py) * 0.04; }
      S.warp += (S.warpTarget - S.warp) * Math.min(1, dt * 0.004);
      if (S.stage === 'warp') S.zoom += dt * 0.001 * (0.15 + 3.2 * S.warp * S.warp);
      const warmTarget = S.stage === 'reveal' ? 0.35 : S.intensity;
      S.skyWarm += (warmTarget - S.skyWarm) * Math.min(1, dt * 0.002);

      if (S.stage === 'build' || S.stage === 'stall') {
        geom = ringGeom();
        if (!reduceMotion) tilt.style.transform = `perspective(900px) rotateY(${-S.px * 5}deg) rotateX(${S.py * 4}deg)`;
      }

      drawSky(ts, dt);
      drawFx(ts);
      requestAnimationFrame(frame);
    }

    window.addEventListener('pointermove', e => { S.tpx = e.clientX / W * 2 - 1; S.tpy = e.clientY / H * 2 - 1; });
    window.addEventListener('deviceorientation', e => {
      if (e.gamma == null || e.beta == null) return;
      S.tpx = clamp(e.gamma / 25, -1, 1);
      S.tpy = clamp((e.beta - 45) / 25, -1, 1);
    });

    // ── Progress curve ──────────────────────────────────────────────────────
    const curve = [
      [0, 0], [0.12, 20], [0.25, 40], [0.40, 60], [0.55, 75],
      [0.68, 85], [0.80, 91], [0.88, 95], [0.93, 97], [0.97, 98], [1.00, 99],
    ];
    const INTRO_DELAY     = 900;
    const PHASE1_DURATION = 7000;
    const STALL_DURATION  = 2200;
    const PHASE2_DURATION = 400;

    function valueAtT(t) {
      for (let i = 1; i < curve.length; i++) {
        if (t <= curve[i][0]) {
          const [t0, v0] = curve[i - 1], [t1, v1] = curve[i];
          return lerp(v0, v1, (t - t0) / (t1 - t0));
        }
      }
      return 99;
    }

    let lastNum = -1;
    function applyValue(v) {
      S.value = v;
      const I = Math.min(1, Math.pow(v / 99, 1.5));
      S.intensity = I;

      arc.style.strokeDashoffset = CIRC * (1 - v / 100);
      const col = ringColor(I);
      g1.setAttribute('stop-color', rgb(col));
      g0.setAttribute('stop-color', rgb(mix(col, [40, 50, 110], 0.55)));
      ringSvg.style.filter = `drop-shadow(0 0 ${3 + I * 9}px ${rgb(col, 0.55 + I * 0.35)})`;

      const rounded = Math.round(v);
      if (rounded !== lastNum) {
        lastNum = rounded;
        num.textContent = rounded;
        num.classList.remove('num-bump');
        void num.offsetWidth;
        num.classList.add('num-bump');
      }
      num.style.backgroundImage = `linear-gradient(180deg, #ffffff 15%, ${rgb(col)})`;
      num.style.filter = `drop-shadow(0 0 ${8 + I * 18}px ${rgb(col, 0.25 + I * 0.4)})`;

      updateAudio(I);
    }

    let phase1Start = null;
    function phase1(ts) {
      if (!phase1Start) phase1Start = ts;
      const t = Math.min((ts - phase1Start) / PHASE1_DURATION, 1);
      applyValue(valueAtT(t));
      if (t < 1) requestAnimationFrame(phase1);
      else startStall();
    }

    function startStall() {
      S.stage = 'stall';
      document.body.classList.add('stall');
      if (!reduceMotion) S.warpTarget = 0.14;
      playRiser(STALL_DURATION / 1000);
      setTimeout(() => requestAnimationFrame(phase2), STALL_DURATION);
    }

    let phase2Start = null;
    function phase2(ts) {
      if (!phase2Start) phase2Start = ts;
      const t = Math.min((ts - phase2Start) / PHASE2_DURATION, 1);
      applyValue(99 + t);
      if (t < 1) requestAnimationFrame(phase2);
      else climax();
    }

    function bloomTo(opacity, ms, easing) {
      bloom.style.transition = `opacity ${ms}ms ${easing}`;
      bloom.style.opacity = opacity;
    }

    function climax() {
      geom = ringGeom();
      S.stage = 'warp';
      S.emitting = false;
      document.body.classList.remove('stall');
      document.body.classList.add('climax');
      ringBurst();
      playClimaxSound();
      stage.classList.add('launch');
      S.warpTarget = reduceMotion ? 0 : 1;

      setTimeout(() => bloomTo(1, 520, 'ease-in'), reduceMotion ? 150 : 780);
      setTimeout(() => {
        S.stage = 'reveal';
        S.warp = S.warpTarget = S.zoom = 0;
        motes.length = sparks.length = waves.length = 0;
        S.moonReady = false;                 // snap moon to its reveal spot under the bloom
        stage.style.visibility = 'hidden';
        bloomTo(0, 1800, 'cubic-bezier(.2,.7,.3,1)');
        reveal.classList.add('active');
      }, reduceMotion ? 700 : 1380);
      setTimeout(() => { launchFireworkShow(); S.ambient = true; }, reduceMotion ? 1500 : 2600);
    }

    // ── Audio engine ────────────────────────────────────────────────────────
    // Cinematic A-minor build: bass rumble + string pad + staccato pulses

    const AC = window.AudioContext || window.webkitAudioContext;
    let ac, master, bassGain, padGain, padFilter, noiseBuffer;
    let pulseTimeout = null;
    let audioReady   = false;
    let audioIntensity = 0;

    function buildReverb(dest) {
      // Parallel comb filters simulating a small room
      const out = ac.createGain();
      out.gain.value = 0.28;
      out.connect(dest);
      [0.019, 0.041, 0.067, 0.097, 0.131].forEach((t, i) => {
        const d = ac.createDelay(0.5);
        const g = ac.createGain();
        d.delayTime.value = t;
        g.gain.value = 0.6 * Math.exp(-i * 0.45);
        d.connect(g); g.connect(out);
      });
      const input = ac.createGain();
      input.gain.value = 1;
      [0.019, 0.041, 0.067, 0.097, 0.131].forEach(t => {
        const d = ac.createDelay(0.5);
        d.delayTime.value = t;
        input.connect(d);
      });
      return input; // connect sources here to add reverb
    }

    function startOsc(freq, type, gainVal, dest) {
      const osc = ac.createOscillator();
      const g   = ac.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      g.gain.value = gainVal;
      osc.connect(g); g.connect(dest);
      osc.start();
      return osc;
    }

    function addVibrato(osc, rate, depth) {
      const lfo = ac.createOscillator();
      const lg  = ac.createGain();
      lfo.type = 'sine';
      lfo.frequency.value = rate;
      lg.gain.value = depth;
      lfo.connect(lg); lg.connect(osc.frequency);
      lfo.start();
    }

    function createNoiseBuffer() {
      const size   = ac.sampleRate * 2;
      const buffer = ac.createBuffer(1, size, ac.sampleRate);
      const data   = buffer.getChannelData(0);
      for (let i = 0; i < size; i++) data[i] = Math.random() * 2 - 1;
      return buffer;
    }

    function initAudio() {
      ac     = new AC();
      master = ac.createGain();
      master.gain.value = 0.75;

      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -16; comp.ratio.value = 4; comp.knee.value = 8;
      master.connect(comp); comp.connect(ac.destination);

      const reverb = buildReverb(master);

      noiseBuffer = createNoiseBuffer();

      // Bass: low sine cluster on A (55 Hz) — deep rumble
      bassGain = ac.createGain();
      bassGain.gain.value = 0;
      bassGain.connect(master);
      [[55, 0.45], [55.25, 0.3], [82.4, 0.2], [27.5, 0.35]].forEach(([f, v]) => {
        startOsc(f, 'sine', v, bassGain);
      });

      // String pad: A-minor chord (A2 C3 E3 G3) with detuned pairs + vibrato
      padGain   = ac.createGain();
      padFilter = ac.createBiquadFilter();
      padFilter.type = 'lowpass';
      padFilter.frequency.value = 700;
      padFilter.Q.value = 1.8;
      padGain.connect(padFilter);
      padFilter.connect(master);
      padGain.connect(reverb); // wet send

      [[110, 110.4], [130.8, 131.2], [164.8, 165.2], [196, 196.5], [220, 220.6]]
        .forEach(([f1, f2]) => {
          const o1 = startOsc(f1, 'sawtooth', 0.055, padGain);
          const o2 = startOsc(f2, 'sawtooth', 0.055, padGain);
          addVibrato(o1, 4.2 + Math.random() * 0.6, 1.2);
          addVibrato(o2, 4.5 + Math.random() * 0.6, 1.4);
        });

      // Also a hollow 5th layer (triangle — softer texture)
      const o5 = startOsc(440, 'triangle', 0.03, padGain);
      addVibrato(o5, 3.8, 0.8);

      schedulePulse();
      audioReady = true;
    }

    function stab(freq, vol, dur) {
      const osc = ac.createOscillator();
      const g   = ac.createGain();
      const f   = ac.createBiquadFilter();
      f.type = 'bandpass'; f.frequency.value = freq * 1.8; f.Q.value = 2.5;
      osc.type = 'sawtooth'; osc.frequency.value = freq;
      g.gain.setValueAtTime(0, ac.currentTime);
      g.gain.linearRampToValueAtTime(vol, ac.currentTime + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
      osc.connect(f); f.connect(g); g.connect(master);
      osc.start(); osc.stop(ac.currentTime + dur + 0.01);
    }

    // Visual beat synced to the audio pulse
    function pulseRing() {
      if (S.stage !== 'build') return;
      ringWrap.classList.remove('beat');
      void ringWrap.offsetWidth;
      ringWrap.classList.add('beat');
    }

    function schedulePulse() {
      const i   = audioIntensity;
      const bpm = 44 + i * 136;          // 44 bpm → 180 bpm
      const ms  = (60 / bpm) * 1000;

      if (i > 0.05) {
        stab(220, 0.07 + i * 0.13, 0.07 + (1 - i) * 0.08);
        pulseRing();
        if (i > 0.5 && Math.random() < i * 0.6)
          setTimeout(() => stab(165, 0.05 + i * 0.08, 0.06), ms * 0.5);
      }
      pulseTimeout = setTimeout(schedulePulse, ms);
    }

    function updateAudio(intensity) {
      if (!audioReady) return;
      audioIntensity = intensity;
      const now = ac.currentTime;
      bassGain.gain.setTargetAtTime(intensity * 0.72, now, 0.9);
      padGain.gain.setTargetAtTime(intensity * 0.55, now, 1.1);
      padFilter.frequency.setTargetAtTime(700 + intensity * 1600, now, 1.4);
    }

    // Whoosh/riser: noise sweep + rising sawtooth, building anticipation into the climax
    function playRiser(duration) {
      if (!audioReady) return;
      const now = ac.currentTime;

      const noise = ac.createBufferSource();
      noise.buffer = noiseBuffer;
      noise.loop   = true;
      const bp = ac.createBiquadFilter();
      bp.type = 'bandpass'; bp.Q.value = 0.9;
      bp.frequency.setValueAtTime(180, now);
      bp.frequency.exponentialRampToValueAtTime(6500, now + duration);
      const ng = ac.createGain();
      ng.gain.setValueAtTime(0.0001, now);
      ng.gain.exponentialRampToValueAtTime(0.5, now + duration * 0.92);
      ng.gain.linearRampToValueAtTime(0.0001, now + duration + 0.05);
      noise.connect(bp); bp.connect(ng); ng.connect(master);

      const osc = ac.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(110, now);
      osc.frequency.exponentialRampToValueAtTime(1400, now + duration);
      const og = ac.createGain();
      og.gain.setValueAtTime(0.0001, now);
      og.gain.exponentialRampToValueAtTime(0.32, now + duration * 0.95);
      og.gain.linearRampToValueAtTime(0.0001, now + duration + 0.05);
      osc.connect(og); og.connect(master);

      noise.start(now); osc.start(now);
      noise.stop(now + duration + 0.1); osc.stop(now + duration + 0.1);
    }

    function playClimaxSound() {
      if (!audioReady) return;
      clearTimeout(pulseTimeout);
      // Full A-minor chord: big impact then long decay
      [[55,'sine',0.22],[110,'sine',0.18],[130.8,'triangle',0.15],
       [164.8,'triangle',0.13],[220,'triangle',0.11],[261.6,'sine',0.09],
       [329.6,'sine',0.07],[440,'sine',0.05]].forEach(([f, type, v]) => {
        const osc = ac.createOscillator();
        const g   = ac.createGain();
        osc.type = type; osc.frequency.value = f;
        g.gain.setValueAtTime(v, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 5);
        osc.connect(g); g.connect(master);
        osc.start(); osc.stop(ac.currentTime + 5.1);
      });
      master.gain.setTargetAtTime(0, ac.currentTime + 2.5, 1.5);
    }

    // ── Start ───────────────────────────────────────────────────────────────
    // The reveal begins on its own as soon as the page loads. Browsers still
    // block audio until a real user gesture, so we try to init/resume it right
    // away, and again silently on the first tap/click/key if it got blocked —
    // the visuals never wait on that.

    resize();
    requestAnimationFrame(frame);

    let started = false;
    function beginReveal() {
      if (started) return;
      started = true;
      try {
        initAudio();
        if (ac.state === 'suspended') ac.resume();
      } catch (e) {}
      setTimeout(() => {
        S.emitting = true;
        requestAnimationFrame(phase1);
      }, INTRO_DELAY);
    }
    beginReveal();

    function resumeAudioIfNeeded() {
      try {
        if (ac && ac.state === 'suspended') ac.resume();
      } catch (e) {}
    }
    ['click', 'touchstart', 'keydown'].forEach(ev =>
      document.addEventListener(ev, resumeAudioIfNeeded)
    );
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
